<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections — Asset Share</title>
  <meta name="template" content="collections">
</head>
<body>
  <header></header>
  <main>

    <!--
      Section 1: Header row — title + primary action.

      Top-level nav destination (sibling of /search) — no back-heading/breadcrumb
      here, same as /search has no heading at all. The title uses the compact
      @kit typography class (docs/UI_KIT.md) instead of a bare <h1>, since the
      default h1 (--heading-font-size-xxl, large top/bottom margins) is sized
      for hero/landing use, not a utility index page header.

      Named-area grid (docs/GRID_LAYOUT.md), same convention as the single
      collection page's header (docs/starter-kit/collection.html):

        areas:  collections-header collections-actions

      "content" block (area: collections-header): just the title.
      "collections-actions" block (area: collections-actions): the "New
      Collection" button, a separate block (not rendered by collections.js
      itself) purely so it can claim its own grid area next to the title.
    -->
    <div>

      <!-- content block: title (area: collections-header) -->
      <div class="content">
        <div>
          <div>
            <h1 class="asc-ui-heading-l">Collections</h1>
          </div>
        </div>
        <div><div>_area</div><div>collections-header</div></div>
      </div>

      <!-- collections-actions block: "New Collection" button (area: collections-actions) -->
      <div class="collections-actions">
        <div><div>_area</div><div>collections-actions</div></div>
      </div>

      <div class="section-metadata">
        <div><div>_layout</div><div>grid</div></div>
        <div><div>_areas</div><div>collections-header collections-actions</div></div>
        <div><div>_columns</div><div>1fr auto</div></div>
      </div>

    </div>

    <!--
      Section 2: Collections listing.
      Separate section from the header above — the collections block renders
      all saved collections from localStorage, full-width below the header row.
    -->
    <div>

      <!-- collections block (zero-config) -->
      <div class="collections"></div>

    </div>
  </main>
  <footer></footer>
</body>
</html>
