<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Sheet — Asset Share</title>
  <meta name="template" content="sheet">
</head>
<body>
  <header></header>
  <main>

    <!--
      Section 1: Sheet header + toolbar.

      Authored content (h1, p) uses {{sheet.*}} tokens resolved by the
      sheet-controls block after it decodes the ?sheet= payload.

      Tokens available:
        {{sheet.title}}       — sheet title (falls back to "Download Sheet")
        {{sheet.description}} — optional description (empty if unset)
        {{sheet.count}}       — number of assets in the sheet
        {{sheet.expiresAt}}   — human-readable expiry date (empty if the link never expires)

      sheet-controls block: rows declare which controls to show (in order).
      Left col = control ID, right col = button label.
      Valid IDs: download, copy-link

      This page is standalone (no site header/footer) by default whenever a
      ?sheet= param is present — see scripts/asc/chrome.js. The sharer's
      "Share as a standalone page" switch (blocks/action-share) makes this an
      explicit per-share choice via &chrome=none|full on the generated URL,
      rather than an implicit rule. Any other "back to X" link an author adds
      to a share/sheet page should carry data-asc-nav-link (like the one
      below) so it's hidden the same way header/footer are when standalone.
    -->
    <div>

      <p><a href="/search" data-asc-nav-link>&#8592; Back to search</a></p>
      <h1>{{sheet.title}}</h1>
      <p>{{sheet.description}}</p>
      <p>{{sheet.count}} assets &#8212; Expires {{sheet.expiresAt|Never}}</p>

      <div class="sheet-controls">
        <div><div>download</div><div>Download</div><div>primary</div></div>
        <div><div>copy-link</div><div>Copy Link</div><div>secondary</div></div>
      </div>

    </div>

    <!--
      Section 2: Read-only board canvas for the shared sheet.
      source: sheet — reads the same ?sheet= param, decodes the payload,
      checks expiry, and renders the asset canvas with search.

      search-properties: comma-separated asset property names to stash into
      each card's data-search attribute for client-side filtering.

      details: optional base path to navigate to when a card is clicked instead
      of opening the default ASC asset details modal.
    -->
    <div>

      <div class="board">
        <div><div>source</div><div>sheet</div></div>
        <div><div>mode</div><div>view</div></div>
        <div><div>search-properties</div><div>title, file-type</div></div>
      </div>

    </div>
  </main>
  <footer></footer>
</body>
</html>
