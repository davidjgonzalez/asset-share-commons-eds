<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Sheet — Asset Share</title>
  <meta name="template" content="sheet">
</head>
<body>
  <header></header>
  <main>

    <!--
      Section 1: Board canvas for the shared sheet.
      The board block reads the ?sheet= URL parameter, decodes the payload,
      checks expiry, and renders the read-only asset canvas with search.

      search-properties: comma-separated asset property names to stash into
      each card's data-search attribute for client-side filtering.

      details: optional base path to navigate to when a card is clicked instead
      of opening the default ASC asset details modal.
    -->
    <div>

      <div class="board">
        <div><div>source</div><div>sheet</div></div>
        <div><div>mode</div><div>view</div></div>
        <div><div>search-properties</div><div>title, file-type</div></div>
      </div>

    </div>
  </main>
  <footer></footer>
</body>
</html>
