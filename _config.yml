title: Asset Share Commons EDS
description: A production-ready AEM Edge Delivery Services front-end for digital asset search, preview, download, and sharing.
baseurl: "/asset-share-commons-eds"
url: "https://davidjgonzalez.github.io"
github_repo: "https://github.com/davidjgonzalez/asset-share-commons-eds"

theme: null
plugins:
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: "index.md"
    values:
      layout: "home"

sass:
  style: compressed
